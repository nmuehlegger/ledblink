[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Vergrößert den Speicherplatz für die App (nötig für Bluetooth A2DP)
board_build.partitions = huge_app.csv

; Lädt automatisch die Bluetooth-Audio-Bibliothek
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git